services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  crm-backend:
    build: ./crm/backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: studio_f
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      UPLOAD_DIR: /app/uploads
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID}
      WHATSAPP_INBOUND_SECRET: ${WHATSAPP_INBOUND_SECRET}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME}
      WHATSAPP_TEMPLATE_LANG: ${WHATSAPP_TEMPLATE_LANG}
      ERP_API_KEY: ${ERP_API_KEY}
      ERP_CERT_FINGERPRINT: ${ERP_CERT_FINGERPRINT}
      ERP_HOST: ${ERP_HOST}
      ERP_PORT: ${ERP_PORT}
      N8N_TEST_AGENT_URL: ${N8N_TEST_AGENT_URL}
      N8N_TEST_AGENT_SECRET: ${N8N_TEST_AGENT_SECRET}
      AGENT_TOOLS_SECRET: ${AGENT_TOOLS_SECRET}
    ports:
      - "4000:4000"
    volumes:
      - backend_uploads:/app/uploads
      # Read-only — this container only ever displays product photos the ERP admin
      # drops via SFTP, never writes here itself (that's the sftp service's job below).
      - product_images:/app/product-images:ro

  # Receives product photos from the ERP's Windows server over SFTP (FTPS/FileZilla
  # sync from their side turned out to be more fragile than just hosting the drop-off
  # folder ourselves — no NAT/passive-port issues, no client-cert pinning needed, and
  # the ERP admin already knows FileZilla's compare-and-sync workflow, just pointed at
  # a new connection instead of their own server). atmoz/sftp is a small, widely-used,
  # single-purpose image made exactly for "one user, one folder, nothing else" — no
  # shell access, chrooted to /home/erpimages/fotos_productos. Named for clarity in
  # FileZilla, not because the path itself means anything to the app.
  product-images-sftp:
    image: atmoz/sftp
    restart: unless-stopped
    volumes:
      - product_images:/home/erpimages/fotos_productos
      # A fresh named volume mounts owned by root — this fixes that on every start
      # (see sftp-init/fix-permissions.sh) instead of it silently rejecting every
      # upload with "Permission denied" until someone chowns it by hand.
      - ./sftp-init:/etc/sftp.d:ro
    ports:
      - "2222:22"
    command: erpimages:${PRODUCT_IMAGES_SFTP_PASSWORD}:1001

  crm-frontend:
    build:
      context: ./crm/frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE: ${VITE_API_BASE}
    restart: unless-stopped
    depends_on:
      - crm-backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
  backend_uploads:
  product_images:
